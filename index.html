<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SD プロンプトビルダー</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222e;
    --surface3: #2a2a38;
    --border: #333344;
    --accent: #7c6af7;
    --accent2: #e06c75;
    --accent-hover: #9d8fff;
    --text: #e8e8f0;
    --text2: #9090a8;
    --text3: #606070;
    --green: #4ec994;
    --yellow: #e5c07b;
    --tag-radius: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─── Header ─── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: .5px; color: var(--accent-hover); }
  header h1 span { color: var(--text2); font-weight: 400; font-size: 12px; margin-left: 6px; }

  .header-tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab-btn {
    padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer; font-size: 12px;
    transition: all .15s;
  }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

  /* ─── Main Layout ─── */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* ─── Left Sidebar ─── */
  .sidebar {
    width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .cat-item {
    padding: 9px 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
    font-size: 13px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all .12s;
    user-select: none;
  }
  .cat-item:hover { background: var(--surface2); color: var(--text); }
  .cat-item.active { border-left-color: var(--accent); background: var(--surface2); color: var(--text); }
  .cat-item .cat-icon { font-size: 15px; width: 18px; text-align: center; }
  .cat-count {
    margin-left: auto; background: var(--surface3); color: var(--text3);
    font-size: 10px; padding: 1px 6px; border-radius: 10px; min-width: 22px; text-align: center;
  }
  .cat-item.active .cat-count { background: var(--accent); color: #fff; }

  /* ─── Tag Panel ─── */
  .tag-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .tag-area {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }
  .tag-area::-webkit-scrollbar { width: 4px; }
  .tag-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .section-label {
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text3); margin-bottom: 8px; margin-top: 4px;
  }
  .tag-group { margin-bottom: 20px; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }

  .tag {
    padding: 4px 10px; border-radius: var(--tag-radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    cursor: pointer;
    font-size: 12px;
    user-select: none;
    transition: all .12s;
    display: flex; align-items: center; gap: 4px;
  }
  .tag:hover { border-color: var(--accent); color: var(--text); background: var(--surface3); }
  .tag.selected {
    border-color: var(--accent);
    background: rgba(124,106,247,.22);
    color: var(--accent-hover);
  }
  .tag.selected-neg {
    border-color: var(--accent2);
    background: rgba(224,108,117,.18);
    color: #ff8c96;
  }
  .tag .tag-weight {
    font-size: 10px; color: var(--yellow); margin-left: 2px;
  }

  /* ─── Search bar ─── */
  .search-bar {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    display: flex;
    gap: 8px;
  }
  .search-bar input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 13px;
    outline: none;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--text3); }

  /* ─── Right Panel ─── */
  .right-panel {
    width: 340px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .prompt-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .prompt-section:last-child { border-bottom: none; }

  .prompt-header {
    padding: 8px 12px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .prompt-header-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text2);
  }
  .prompt-header-label.neg { color: var(--accent2); }
  .prompt-count { font-size: 10px; color: var(--text3); margin-left: 2px; }

  .prompt-tags {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 5px;
  }
  .prompt-tags::-webkit-scrollbar { width: 3px; }
  .prompt-tags::-webkit-scrollbar-thumb { background: var(--border); }

  .prompt-chip {
    display: flex; align-items: center; gap: 4px;
    background: rgba(124,106,247,.18); border: 1px solid rgba(124,106,247,.4);
    border-radius: var(--tag-radius);
    padding: 3px 8px; font-size: 12px; color: var(--accent-hover);
    cursor: default; user-select: none;
    position: relative;
  }
  .prompt-chip.neg {
    background: rgba(224,108,117,.15); border-color: rgba(224,108,117,.4);
    color: #ff8c96;
  }
  .prompt-chip.custom {
    border-style: dashed;
  }
  .prompt-chip .chip-weight {
    font-size: 10px; color: var(--yellow); cursor: pointer;
  }
  .prompt-chip .chip-weight:hover { color: #fff; }
  .chip-remove {
    font-size: 11px; color: var(--text3); cursor: pointer; margin-left: 1px;
    line-height: 1; width: 14px; height: 14px; display: flex; align-items: center;
    justify-content: center; border-radius: 50%;
  }
  .chip-remove:hover { background: rgba(255,255,255,.15); color: var(--text); }

  /* Weight popover */
  .weight-popup {
    position: fixed;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    z-index: 9999;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    min-width: 180px;
  }
  .weight-popup.visible { display: block; }
  .weight-popup label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 6px; }
  .weight-popup input[type=range] { width: 100%; accent-color: var(--accent); }
  .weight-popup .weight-val { font-size: 13px; color: var(--yellow); font-weight: 700; text-align: center; display: block; margin-top: 4px; }
  .weight-presets { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .wp-btn {
    flex: 1; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--surface3); color: var(--text2); cursor: pointer; font-size: 11px;
    text-align: center;
  }
  .wp-btn:hover { border-color: var(--accent); color: var(--text); }

  /* ─── Output box ─── */
  .output-section {
    flex-shrink: 0;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
  }
  .output-row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 6px; }
  .output-row:last-child { margin-bottom: 0; }
  .output-label { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; min-width: 28px; margin-top: 5px; }
  .output-box {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 11px; color: var(--text2);
    line-height: 1.5; min-height: 36px; font-family: monospace;
    word-break: break-word; cursor: text;
  }
  .copy-btn {
    padding: 5px 12px; border-radius: 6px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; font-size: 12px;
    font-weight: 600; transition: all .15s; white-space: nowrap; align-self: flex-end;
  }
  .copy-btn:hover { background: var(--accent-hover); }
  .copy-btn.copied { background: var(--green); }
  .copy-btn.neg { background: var(--accent2); }
  .copy-btn.neg:hover { background: #ff8c96; }

  /* ─── Custom tag input ─── */
  .custom-input-row {
    display: flex; gap: 6px; padding: 8px 12px;
    border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .custom-input-row input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; color: var(--text); font-size: 12px; outline: none;
  }
  .custom-input-row input:focus { border-color: var(--accent); }
  .custom-input-row input::placeholder { color: var(--text3); }
  .add-btn {
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface3); color: var(--text2); cursor: pointer; font-size: 12px;
    transition: all .15s;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--text); }
  .add-neg-btn { border-color: rgba(224,108,117,.4); }
  .add-neg-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  /* ─── Presets ─── */
  .preset-bar {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    flex-shrink: 0;
  }
  .preset-label { font-size: 10px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
  .preset-btn {
    padding: 3px 9px; border-radius: 12px; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer; font-size: 11px;
    transition: all .12s;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--text); }

  /* ─── Empty state ─── */
  .empty-hint {
    color: var(--text3); font-size: 12px; text-align: center;
    padding: 20px; line-height: 1.8;
  }

  /* ─── Clear btn ─── */
  .clear-btn {
    margin-left: auto; padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent; background: transparent;
    color: var(--text3); cursor: pointer; font-size: 11px; transition: all .12s;
  }
  .clear-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  /* ─── Custom input / translation ─── */
  .custom-input-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .translate-preview {
    font-size: 10px; color: var(--yellow); padding: 0 4px;
    min-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .translate-preview.loading { color: var(--text3); font-style: italic; }
  .translate-preview.error { color: var(--accent2); }
  .save-btn { border-color: rgba(229,192,123,.4); white-space: nowrap; }
  .save-btn:hover { border-color: var(--yellow); color: var(--yellow); }
  .save-btn.saved { border-color: var(--green); color: var(--green); }

  /* ─── カスタムタグの削除ボタン ─── */
  .tag .tag-del {
    font-size: 10px; color: var(--text3); margin-left: 3px; cursor: pointer;
    line-height: 1; width: 13px; height: 13px; display: inline-flex;
    align-items: center; justify-content: center; border-radius: 50%;
    flex-shrink: 0;
  }
  .tag .tag-del:hover { background: rgba(224,108,117,.3); color: var(--accent2); }
  .tag.user-custom { border-style: dashed; }

  /* ─── カテゴリ選択ポップアップ ─── */
  .cat-picker-popup {
    position: fixed; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; z-index: 9999; display: none;
    box-shadow: 0 8px 28px rgba(0,0,0,.6); width: 230px;
  }
  .cat-picker-popup.visible { display: block; }
  .cat-picker-title {
    font-size: 10px; color: var(--text3); letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .cat-picker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .cat-picker-btn {
    padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface3); color: var(--text2); cursor: pointer; font-size: 11px;
    text-align: left; transition: all .12s; display: flex; align-items: center; gap: 5px;
  }
  .cat-picker-btn:hover { border-color: var(--accent); color: var(--text); background: rgba(124,106,247,.12); }

  /* ─── Scrollbars ─── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>SD プロンプトビルダー <span>Stable Diffusion 用</span></h1>
  <div class="header-tabs">
    <button class="tab-btn active" onclick="switchTab('positive')">ポジティブ</button>
    <button class="tab-btn" onclick="switchTab('negative')">ネガティブ</button>
    <button class="tab-btn" onclick="switchTab('both')">両方</button>
  </div>
</header>

<div class="main">
  <!-- Left: Category sidebar -->
  <div class="sidebar" id="sidebar"></div>

  <!-- Center: Tags -->
  <div class="tag-panel">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="タグを検索... (例: lighting, anime, 1girl)" oninput="filterTags(this.value)">
    </div>
    <div class="tag-area" id="tagArea"></div>
  </div>

  <!-- Right: Prompt builder -->
  <div class="right-panel">
    <div class="preset-bar">
      <span class="preset-label">プリセット</span>
      <button class="preset-btn" onclick="applyPreset('portrait')">ポートレート</button>
      <button class="preset-btn" onclick="applyPreset('landscape')">風景</button>
      <button class="preset-btn" onclick="applyPreset('anime')">アニメ</button>
      <button class="preset-btn" onclick="applyPreset('photo')">写真</button>
      <button class="preset-btn" onclick="clearAll()">✕ 全消去</button>
    </div>

    <!-- Positive prompt -->
    <div class="prompt-section" id="posSection">
      <div class="prompt-header">
        <span class="prompt-header-label">ポジティブ</span>
        <span class="prompt-count" id="posCount">0 個</span>
        <button class="clear-btn" onclick="clearPrompt('pos')">クリア</button>
      </div>
      <div class="prompt-tags" id="posTags">
        <div class="empty-hint">カテゴリからタグをクリックして追加</div>
      </div>
      <div class="custom-input-row">
        <div class="custom-input-wrap">
          <input type="text" id="customPos" placeholder="日本語または英語で入力..."
                 oninput="onCustomInput(this.value)"
                 onkeydown="if(event.key==='Enter')addCustomTag('pos')">
          <div class="translate-preview" id="translatePreview"></div>
        </div>
        <button class="add-btn" onclick="addCustomTag('pos')">＋ポジ</button>
        <button class="add-btn add-neg-btn" onclick="addCustomTag('neg')">＋ネガ</button>
        <button class="add-btn save-btn" id="saveBtn" onclick="openCatPicker(event)" title="既存カテゴリに永続保存">★保存</button>
      </div>
    </div>

    <!-- Negative prompt -->
    <div class="prompt-section" id="negSection">
      <div class="prompt-header">
        <span class="prompt-header-label neg">ネガティブ</span>
        <span class="prompt-count" id="negCount">0 個</span>
        <button class="clear-btn" onclick="clearPrompt('neg')">クリア</button>
      </div>
      <div class="prompt-tags" id="negTags">
        <div class="empty-hint">ネガティブタグをクリックして追加</div>
      </div>
    </div>

    <!-- Output -->
    <div class="output-section">
      <div class="output-row">
        <span class="output-label">POS</span>
        <div class="output-box" id="posOutput">—</div>
        <button class="copy-btn" id="copyPosBtn" onclick="copyPrompt('pos')">コピー</button>
      </div>
      <div class="output-row">
        <span class="output-label">NEG</span>
        <div class="output-box" id="negOutput">—</div>
        <button class="copy-btn neg" id="copyNegBtn" onclick="copyPrompt('neg')">コピー</button>
      </div>
    </div>
  </div>
</div>

<!-- Category picker popup -->
<div class="cat-picker-popup" id="catPickerPopup">
  <div class="cat-picker-title">追加するカテゴリを選択</div>
  <div class="cat-picker-grid" id="catPickerGrid"></div>
</div>

<!-- Weight popup -->
<div class="weight-popup" id="weightPopup">
  <label id="weightLabel">強度: <strong id="weightTagName">tag</strong></label>
  <input type="range" id="weightSlider" min="0.5" max="2.0" step="0.05" value="1.0" oninput="onWeightChange(this.value)">
  <span class="weight-val" id="weightVal">1.0</span>
  <div class="weight-presets">
    <button class="wp-btn" onclick="setWeight(0.5)">0.5</button>
    <button class="wp-btn" onclick="setWeight(0.8)">0.8</button>
    <button class="wp-btn" onclick="setWeight(1.0)">1.0</button>
    <button class="wp-btn" onclick="setWeight(1.2)">1.2</button>
    <button class="wp-btn" onclick="setWeight(1.5)">1.5</button>
    <button class="wp-btn" onclick="setWeight(2.0)">2.0</button>
  </div>
</div>

<script>
// ─── Japanese display labels (keys = English prompt values) ──────────────────
const TAG_LABELS = {
  // 品質
  'masterpiece':'傑作', 'best quality':'最高品質', 'high quality':'高品質',
  'ultra detailed':'超詳細', 'ultra-high resolution':'超高解像度',
  '8k':'8K', '4k uhd':'4K UHD', 'highres':'高解像度', 'absurdres':'極高解像度',
  'extremely detailed':'非常に詳細', 'intricate details':'精緻なディテール',
  'sharp focus':'シャープ', 'professionally shot':'プロ撮影風',
  'RAW photo':'RAW写真', 'film grain':'フィルムグレイン',
  // スタイル
  'anime':'アニメ', 'manga':'漫画', 'illustration':'イラスト',
  'digital art':'デジタルアート', 'concept art':'コンセプトアート',
  'photorealistic':'フォトリアル', 'hyperrealistic':'超リアル',
  'oil painting':'油絵', 'watercolor':'水彩画', 'pencil sketch':'鉛筆スケッチ',
  'ink drawing':'墨絵', 'pixel art':'ドット絵', 'cel shading':'セルシェーディング',
  'fantasy art':'ファンタジーアート', 'cyberpunk':'サイバーパンク',
  'steampunk':'スチームパンク', 'vaporwave':'ヴェイパーウェーブ',
  // 被写体
  '1girl':'女の子1人', '1boy':'男の子1人', 'solo':'ソロ', 'duo':'2人', 'group':'グループ',
  'beautiful woman':'美しい女性', 'handsome man':'ハンサムな男性',
  'young woman':'若い女性', 'young man':'若い男性',
  'child':'子供', 'elderly':'老人', 'warrior':'戦士', 'mage':'魔法使い',
  'knight':'騎士', 'elf':'エルフ', 'dragon':'ドラゴン', 'cat':'猫',
  'wolf':'狼', 'robot':'ロボット', 'android':'アンドロイド',
  // 髪型
  'long hair':'ロングヘア', 'short hair':'ショートヘア', 'medium hair':'ミディアムヘア',
  'twin tails':'ツインテール', 'ponytail':'ポニーテール', 'braided hair':'編み込み',
  'curly hair':'カーリーヘア', 'straight hair':'ストレートヘア', 'wavy hair':'ウェーブヘア',
  'black hair':'黒髪', 'blonde hair':'ブロンド', 'brown hair':'茶髪',
  'white hair':'白髪', 'silver hair':'シルバー', 'pink hair':'ピンク髪',
  'blue hair':'青髪', 'gradient hair':'グラデーション',
  // 目・瞳
  'blue eyes':'青い瞳', 'green eyes':'緑の瞳', 'brown eyes':'茶色の瞳',
  'red eyes':'赤い瞳', 'golden eyes':'金の瞳', 'purple eyes':'紫の瞳',
  'heterochromia':'オッドアイ', 'glowing eyes':'発光する瞳', 'sharp eyes':'鋭い目',
  'large eyes':'大きな目', 'detailed eyes':'詳細な瞳', 'beautiful eyes':'美しい瞳',
  // 表情
  'smile':'笑顔', 'grin':'ニヤリ', 'laughing':'笑い',
  'serious expression':'真剣な表情', 'calm expression':'穏やかな表情',
  'sad expression':'悲しい表情', 'angry':'怒り', 'surprised':'驚き',
  'shy':'恥ずかしがり', 'confident':'自信満々',
  'looking at viewer':'こちらを見ている', 'looking away':'よそ見',
  'looking up':'上を向く', 'looking down':'下を向く',

// ─── カスタムタグ (localStorage) ─────────────────────────────────────────────
const CUSTOM_TAGS_KEY = 'sd_custom_tags_v2';
let customTagsByCategory = {}; // { [catId]: [{en, ja}] }

function loadCustomTags() {
  try { customTagsByCategory = JSON.parse(localStorage.getItem(CUSTOM_TAGS_KEY) || '{}'); } catch(e) { customTagsByCategory = {}; }
  Object.values(customTagsByCategory).flat().forEach(({ en, ja }) => {
    if (ja && ja !== en) TAG_LABELS[en] = ja;
  });
}

function persistCustomTags() {
  localStorage.setItem(CUSTOM_TAGS_KEY, JSON.stringify(customTagsByCategory));
}

function removeCustomTag(catId, en) {
  if (!customTagsByCategory[catId]) return;
  customTagsByCategory[catId] = customTagsByCategory[catId].filter(t => t.en !== en);
  persistCustomTags();
  renderSidebar();
  renderTags(activeCategory, document.getElementById('searchInput').value);
}

// ─── Translation ──────────────────────────────────────────────────────────────
let translateTimer = null;
let pendingTranslation = { en: '', ja: '' };

function containsJapanese(str) {
  return /[぀-鿿＀-￯]/.test(str);
}

function onCustomInput(val) {
  clearTimeout(translateTimer);
  const preview = document.getElementById('translatePreview');
  if (!val.trim()) {
    preview.textContent = '';
    preview.className = 'translate-preview';
    pendingTranslation = { en: '', ja: '' };
    return;
  }
  if (containsJapanese(val)) {
    preview.textContent = '翻訳中...';
    preview.className = 'translate-preview loading';
    translateTimer = setTimeout(() => translateText(val), 600);
  } else {
    pendingTranslation = { en: val.trim(), ja: val.trim() };
    preview.textContent = '';
    preview.className = 'translate-preview';
  }
}

async function translateText(text) {
  const preview = document.getElementById('translatePreview');
  try {
    const res = await fetch(
      'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=ja|en'
    );
    const data = await res.json();
    if (data.responseStatus === 200) {
      const en = data.responseData.translatedText.toLowerCase().trim();
      pendingTranslation = { en, ja: text };
      preview.textContent = '→ ' + en;
      preview.className = 'translate-preview';
    } else {
      throw new Error('API error');
    }
  } catch(e) {
    pendingTranslation = { en: text, ja: text };
    preview.textContent = '（翻訳失敗・英語入力を使用）';
    preview.className = 'translate-preview error';
  }
}

let selectedPos = new Map(); // tag -> weight
let selectedNeg = new Map();

function init() {
  loadCustomTags();

}

// ─── Sidebar ─────────────────────────────────────────────────────────────────
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const customCount = (customTagsByCategory[cat.id] || []).length;
    const total = cat.tags.length + customCount;
    const div = document.createElement('div');
    div.className = 'cat-item' + (cat.id === activeCategory ? ' active' : '');
    div.innerHTML = `<span class="cat-icon">${cat.icon}</span>${cat.name}<span class="cat-count">${total}</span>`;
    div.onclick = () => selectCategory(cat.id);
    sidebar.appendChild(div);
  });
}

function selectCategory(id) {
  activeCategory = id;
  document.getElementById('searchInput').value = '';
  renderSidebar();
  renderTags(id);
}

// ─── Tags ─────────────────────────────────────────────────────────────────────
function makeTagEl(tag, catId, isCustom = false) {
  const isPos = selectedPos.has(tag);
  const isNeg = selectedNeg.has(tag);
  const el = document.createElement('span');
  el.className = 'tag' + (isPos ? ' selected' : '') + (isNeg ? ' selected-neg' : '') + (isCustom ? ' user-custom' : '');
  const weight = isPos ? selectedPos.get(tag) : (isNeg ? selectedNeg.get(tag) : 1.0);
  const label = TAG_LABELS[tag] || tag;
  const safeTag = tag.replace(/'/g, "\\'");
  const safeCat = catId.replace(/'/g, "\\'");
  el.innerHTML = label + (weight !== 1.0 ? `<span class="tag-weight">:${weight}</span>` : '')
    + (isCustom ? `<span class="tag-del" title="このカテゴリから削除" onclick="event.stopPropagation();removeCustomTag('${safeCat}','${safeTag}')">×</span>` : '');
  el.title = tag;
  el.onclick = (e) => handleTagClick(e, tag, catId);
  return el;
}

function renderTags(catId, filter = '') {
  const area = document.getElementById('tagArea');
  area.innerHTML = '';

  let cats;
  if (catId === '__search__') {
    const f = filter.toLowerCase();
    cats = CATEGORIES.map(c => {
      const builtIn = c.tags.filter(t => t.toLowerCase().includes(f) || (TAG_LABELS[t] || '').includes(filter));
      const custom = (customTagsByCategory[c.id] || []).filter(t =>
        t.en.toLowerCase().includes(f) || (t.ja || '').includes(filter)
      );
      return { ...c, builtIn, custom };
    }).filter(c => c.builtIn.length + c.custom.length > 0);
  } else {
    const c = CATEGORIES.find(c => c.id === catId);
    cats = c ? [{ ...c, builtIn: c.tags, custom: customTagsByCategory[catId] || [] }] : [];
  }

  if (!cats.length) {
    area.innerHTML = '<div class="empty-hint">一致するタグが見つかりません</div>';
    return;
  }

  cats.forEach(cat => {
    const group = document.createElement('div');
    group.className = 'tag-group';
    if (catId === '__search__') {
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = cat.icon + ' ' + cat.name;
      group.appendChild(lbl);
    }
    const tagsDiv = document.createElement('div');
    tagsDiv.className = 'tags';
    cat.builtIn.forEach(tag => tagsDiv.appendChild(makeTagEl(tag, cat.id, false)));
    (cat.custom || []).forEach(({ en }) => tagsDiv.appendChild(makeTagEl(en, cat.id, true)));
    group.appendChild(tagsDiv);
    area.appendChild(group);
  });
}

function handleTagClick(e, tag, catId) {
  const isNegCat = catId === 'negative';
  if (isNegCat) {
    toggleTag('neg', tag);
  } else {
    toggleTag('pos', tag);
  }
}

function toggleTag(type, tag) {
  const map = type === 'pos' ? selectedPos : selectedNeg;
  const other = type === 'pos' ? selectedNeg : selectedPos;
  if (map.has(tag)) {
    map.delete(tag);
  } else {
    other.delete(tag);
    map.set(tag, 1.0);
  }
  refreshAll();
}

function filterTags(val) {
  if (!val.trim()) {
    renderTags(activeCategory);
    return;
  }
  renderTags('__search__', val.trim());
}

// ─── Prompt chips ─────────────────────────────────────────────────────────────
function renderPromptChips(type) {
  const map = type === 'pos' ? selectedPos : selectedNeg;
  const container = document.getElementById(type + 'Tags');
  const countEl = document.getElementById(type + 'Count');

  container.innerHTML = '';
  countEl.textContent = map.size + ' 個';

  if (map.size === 0) {
    container.innerHTML = type === 'pos'
      ? '<div class="empty-hint">カテゴリからタグをクリックして追加</div>'
      : '<div class="empty-hint">ネガティブタグを追加</div>';
    return;
  }

  map.forEach((weight, tag) => {
    const chip = document.createElement('div');
    chip.className = 'prompt-chip' + (type === 'neg' ? ' neg' : '');
    const isCustom = !CATEGORIES.some(c => c.tags.includes(tag));
    if (isCustom) chip.classList.add('custom');

    const wLabel = weight !== 1.0 ? `<span class="chip-weight" title="クリックで重みを変更" onclick="openWeightPopup(event,'${type}','${tag.replace(/'/g,"\\'")}',this)">${weight.toFixed(2)}</span>` : `<span class="chip-weight" title="クリックで重みを設定" onclick="openWeightPopup(event,'${type}','${tag.replace(/'/g,"\\'")}',this)">⚖</span>`;

    const displayLabel = TAG_LABELS[tag] || tag;
    chip.innerHTML = `<span title="${tag}">${displayLabel}</span>${wLabel}<span class="chip-remove" onclick="removeChip('${type}','${tag.replace(/'/g,"\\'")}')">×</span>`;
    container.appendChild(chip);
  });
}

function removeChip(type, tag) {
  const map = type === 'pos' ? selectedPos : selectedNeg;
  map.delete(tag);
  refreshAll();
}

// ─── Weight ──────────────────────────────────────────────────────────────────
function openWeightPopup(e, type, tag, el) {
  e.stopPropagation();
  const popup = document.getElementById('weightPopup');
  const map = type === 'pos' ? selectedPos : selectedNeg;
  const w = map.get(tag) || 1.0;
  document.getElementById('weightTagName').textContent = tag;
  document.getElementById('weightSlider').value = w;
  document.getElementById('weightVal').textContent = w.toFixed(2);
  weightTarget = { type, tag };

  const rect = el.getBoundingClientRect();
  popup.style.left = Math.min(rect.left, window.innerWidth - 200) + 'px';
  popup.style.top = (rect.bottom + 6) + 'px';
  popup.classList.add('visible');
}

function onWeightChange(v) {
  document.getElementById('weightVal').textContent = parseFloat(v).toFixed(2);
  if (weightTarget) {
    const map = weightTarget.type === 'pos' ? selectedPos : selectedNeg;
    map.set(weightTarget.tag, parseFloat(v));
    renderPromptChips(weightTarget.type);
    updateOutput();
    renderTags(activeCategory, document.getElementById('searchInput').value);
  }
}

function setWeight(v) {
  document.getElementById('weightSlider').value = v;
  onWeightChange(v);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.weight-popup') && !e.target.classList.contains('chip-weight')) {
    document.getElementById('weightPopup').classList.remove('visible');
    weightTarget = null;
  }
  if (!e.target.closest('.cat-picker-popup') && !e.target.closest('#saveBtn')) {
    closeCatPicker();
  }
});

// ─── Output ───────────────────────────────────────────────────────────────────
function buildPromptString(map) {
  const parts = [];
  map.forEach((weight, tag) => {
    if (weight === 1.0) {
      parts.push(tag);
    } else if (weight > 1.0) {
      const depth = Math.round((weight - 1.0) / 0.1);
      let s = tag;
      for (let i = 0; i < depth; i++) s = `(${s})`;
      parts.push(s);
    } else {
      parts.push(`[${tag}:${weight.toFixed(2)}]`);
    }
  });
  return parts.join(', ');
}

function updateOutput() {
  const posStr = buildPromptString(selectedPos);
  const negStr = buildPromptString(selectedNeg);
  document.getElementById('posOutput').textContent = posStr || '—';
  document.getElementById('negOutput').textContent = negStr || '—';
}

function copyPrompt(type) {
  const map = type === 'pos' ? selectedPos : selectedNeg;
  const str = buildPromptString(map);
  if (!str) return;
  navigator.clipboard.writeText(str).then(() => {
    const btn = document.getElementById('copy' + (type === 'pos' ? 'Pos' : 'Neg') + 'Btn');
    btn.textContent = 'コピー完了!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'コピー';
      btn.classList.remove('copied');
    }, 1500);
  });
}

// ─── Custom tag ───────────────────────────────────────────────────────────────
function clearCustomInput() {
  document.getElementById('customPos').value = '';
  document.getElementById('translatePreview').textContent = '';
  document.getElementById('translatePreview').className = 'translate-preview';
  pendingTranslation = { en: '', ja: '' };
}

function addCustomTag(type) {
  const input = document.getElementById('customPos');
  const val = input.value.trim();
  if (!val) return;
  const map = type === 'pos' ? selectedPos : selectedNeg;
  const other = type === 'pos' ? selectedNeg : selectedPos;
  // カンマ区切りの場合は翻訳なしで直接追加
  if (val.includes(',')) {
    val.split(',').map(t => t.trim()).filter(Boolean).forEach(t => { other.delete(t); map.set(t, 1.0); });
  } else {
    const en = pendingTranslation.en || val;
    const ja = pendingTranslation.ja || val;
    if (ja !== en) TAG_LABELS[en] = ja;
    other.delete(en);
    map.set(en, 1.0);
  }
  clearCustomInput();
  refreshAll();
}

function openCatPicker(e) {
  e.stopPropagation();
  const input = document.getElementById('customPos');
  if (!input.value.trim()) return;
  const popup = document.getElementById('catPickerPopup');
  const grid = document.getElementById('catPickerGrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-picker-btn';
    btn.innerHTML = `<span>${cat.icon}</span>${cat.name}`;
    btn.onclick = (ev) => { ev.stopPropagation(); saveToCategory(cat.id); };
    grid.appendChild(btn);
  });
  const rect = e.currentTarget.getBoundingClientRect();
  popup.style.left = Math.min(rect.left, window.innerWidth - 240) + 'px';
  popup.style.top = (rect.bottom + 6) + 'px';
  popup.classList.add('visible');
}

function saveToCategory(catId) {
  const input = document.getElementById('customPos');
  const val = input.value.trim();
  if (!val) return;
  const en = pendingTranslation.en || val;
  const ja = pendingTranslation.ja || val;
  if (!customTagsByCategory[catId]) customTagsByCategory[catId] = [];
  if (customTagsByCategory[catId].some(t => t.en === en)) {
    closeCatPicker();
    const btn = document.getElementById('saveBtn');
    btn.textContent = '登録済み';
    setTimeout(() => { btn.textContent = '★保存'; }, 1200);
    return;
  }
  customTagsByCategory[catId].push({ en, ja });
  if (ja !== en) TAG_LABELS[en] = ja;
  persistCustomTags();
  closeCatPicker();
  clearCustomInput();
  const btn = document.getElementById('saveBtn');
  btn.textContent = '保存完了!';
  btn.classList.add('saved');
  setTimeout(() => { btn.textContent = '★保存'; btn.classList.remove('saved'); }, 1500);
  renderSidebar();
  if (activeCategory === catId) renderTags(catId);
}

function closeCatPicker() {
  document.getElementById('catPickerPopup').classList.remove('visible');
}

// ─── Presets ──────────────────────────────────────────────────────────────────
function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  selectedPos = new Map(p.pos.map(t => [t, 1.0]));
  selectedNeg = new Map(p.neg.map(t => [t, 1.0]));
  refreshAll();
}

function clearAll() {
  selectedPos.clear();
  selectedNeg.clear();
  refreshAll();
}

function clearPrompt(type) {
  const map = type === 'pos' ? selectedPos : selectedNeg;
  if (type === 'pos') selectedPos = new Map();
  else selectedNeg = new Map();
  refreshAll();
}

// ─── Tab ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['positive','negative','both'][i] === tab);
  });
  updateLayout();
}

function updateLayout() {
  const posSection = document.getElementById('posSection');
  const negSection = document.getElementById('negSection');
  if (currentTab === 'positive') {
    posSection.style.display = 'flex';
    negSection.style.display = 'none';
    posSection.style.flex = '1';
  } else if (currentTab === 'negative') {
    posSection.style.display = 'none';
    negSection.style.display = 'flex';
    negSection.style.flex = '1';
  } else {
    posSection.style.display = 'flex';
    negSection.style.display = 'flex';
    posSection.style.flex = '1';
    negSection.style.flex = '1';
  }
}

// ─── Refresh all ─────────────────────────────────────────────────────────────
function refreshAll() {
  renderPromptChips('pos');
  renderPromptChips('neg');
  updateOutput();
  renderTags(
    document.getElementById('searchInput').value ? '__search__' : activeCategory,
    document.getElementById('searchInput').value
  );
}

// ─── Start ────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
